# Développement : construit l'image localement
services:
  web:
    build: .
    ports:
      - "5000:5000"
    restart: unless-stopped
    volumes:
      - incidents_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  incidents_data:
