# Déploiement : utilise l'image publiée dans GHCR (aucun build)
# Compte GitHub proprietaire du depot : nour5366 (en minuscules). Si le depot change de compte, modifier cette valeur.
services:
  web:
    image: ghcr.io/nour5366/gestion-incidents:latest
    container_name: gestion-incidents
    ports:
      - "5000:5000"
    restart: unless-stopped
    volumes:
      - incidents_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  incidents_data:
